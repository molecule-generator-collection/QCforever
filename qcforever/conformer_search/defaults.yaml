# Built-in defaults. Copy this file and supply only changed settings if desired.
schema_version: 1
profile: low
candidate_retention: merge
seed: 20261006
workers: 8
threads: 4
device: auto
mm_method: mmff94s
budget:
  formula: exponential_rings
  base: 10
  growth: 1.3
  ring_weight: 5
  maximum: 100
  raw_attempt_multiplier: 2
relaxation:
  # auto: batched SH; PM6 checkpoint restart or xTB retained processes.
  implementation: auto
  algorithm: sh
  convergence_fraction: 0.50
  first_interval: 1
  subsequent_interval: 10
  initial_steps_per_candidate: 20
  budget_increment_steps_per_candidate: 20
  maximum_budget_rounds: 50
  initial_delta_force: 1.0
  delta_force_floor: 0.000001
  parallel_candidates: auto  # Up to nproc one-core candidates; 1 restores sequential execution.
  timeout_seconds_per_call: 1800
  maximum_cycles: 1000
  xtb_executable: xtb
  xtb_opt_level: normal
  xtb_accuracy: 1.0
  xtb_pool_memory_mb: 8192
  xtb_active_timeout_seconds: 1800
generators:
  ditmc: {}
  torsional_diffusion: {}
validation:
  minimum_bonded_covalent_ratio: 0.60
  duplicate_rmsd_angstrom: 0.10
  duplicate_max_matches: 10000
  require_tetrahedral_stereo_for_best: true
  require_ez_stereo_for_best: true
